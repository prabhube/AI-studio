# ============================================================
# Prabhu AI Studio — Backend Python Project Configuration
#
# pyproject.toml is the single source of truth for:
#   - Project metadata
#   - Tool configuration (ruff, mypy, pytest)
#   - Build system declaration
#
# WHY pyproject.toml instead of setup.cfg or setup.py?
#   PEP 517/518 standard. Works with all modern build tools.
#   Keeps all configuration in one file rather than scattered
#   across pytest.ini, .mypy.ini, .ruff.toml, setup.cfg.
# ============================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "prabhu-ai-studio-backend"
version = "1.0.0"
description = "Prabhu AI Studio — Local-first AI video generation backend"
requires-python = ">=3.12"
readme = "README.md"

# ============================================================
# Ruff — Fast Python linter and formatter
# WHY: Replaces flake8 + isort + black in a single tool.
#      100x faster than flake8. Enforces consistent style.
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no stray print statements)
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN101", # self annotation not required
    "ANN102", # cls annotation not required
    "S101",   # assert is fine in tests
]
exclude = ["alembic/", ".venv/", "tests/"]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "T20"]

# ============================================================
# MyPy — Static type checker
# WHY: Catches type errors at development time, not runtime.
#      Enforces type hints throughout the codebase.
# ============================================================

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

# ============================================================
# Pytest — Test runner configuration
# WHY: asyncio_mode=auto enables async tests without decorators.
#      cov settings enforce a minimum coverage threshold.
# ============================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ============================================================
# Coverage — Code coverage configuration
# WHY: Measures what percentage of the application code is
#      exercised by tests. Fails below the threshold.
# ============================================================

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]
