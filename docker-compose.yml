version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: prabhu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prabhu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prabhu_secret}
      POSTGRES_DB: ${POSTGRES_DB:-prabhu_ai_studio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prabhu} -d ${POSTGRES_DB:-prabhu_ai_studio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prabhu_network

  redis:
    image: redis:7-alpine
    container_name: prabhu_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prabhu_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: prabhu_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prabhu_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: prabhu_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - prabhu_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  prabhu_network:
    driver: bridge
