# ============================================================
# Prabhu AI Studio — Nginx Reverse Proxy Configuration
#
# WHY Nginx in front of the stack?
#   - Routes /api/* to the FastAPI backend (port 8000)
#   - Routes /* to the Next.js frontend (port 3000)
#   - Serves static media files directly from disk (bypasses Python)
#   - Handles SSL termination in production
#   - Provides gzip compression
#   - Enforces request size limits for media uploads
#
# NOTE: This is prepared for Phase 8 (production hardening).
#       Development uses direct ports instead.
# ============================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# Rate limiting zone — 10 req/s per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    # Max upload size (matches MAX_UPLOAD_SIZE_MB in .env)
    client_max_body_size 500M;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-Frame-Options           "DENY"          always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ----------------------------
    # API — FastAPI backend
    # ----------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;  # Long timeout for AI generation
    }

    # ----------------------------
    # Media — static files served directly from disk
    # WHY: Serving via Nginx is 10-100x faster than serving
    #      through Python/FastAPI for large media files.
    # ----------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ----------------------------
    # Frontend — Next.js
    # ----------------------------
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
