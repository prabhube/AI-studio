# ============================================================
# Prabhu AI Studio — Redis Configuration
#
# WHY a custom redis.conf?
#   Docker's default Redis has no memory limit, no persistence
#   config, and no password. This sets production-safe defaults.
#
# Redis roles in this application:
#   1. Celery broker      — task queue for AI generation jobs
#   2. Celery result backend — job status and return values
#   3. API rate limiting  — request counters per IP (via SlowAPI)
#   4. Session cache      — optional fast lookups (future)
# ============================================================

# ----------------------------
# Memory management
# WHY: Without a limit, Redis can consume all system RAM.
#      allkeys-lru evicts least-recently-used keys when full.
#      This is safe for caching workloads.
# ----------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru

# ----------------------------
# Persistence — AOF (Append Only File)
# WHY: Celery task state must survive Redis restarts.
#      AOF provides durability without full RDB snapshots.
# ----------------------------
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no

# ----------------------------
# Slow log
# WHY: Logs any command taking longer than 10ms.
#      Useful for diagnosing performance issues.
# ----------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ----------------------------
# Connection
# ----------------------------
tcp-keepalive 60
timeout 300

# ----------------------------
# Keyspace notifications
# WHY: Allows Celery to receive events when task keys expire.
#      Required for reliable task timeout detection.
# ----------------------------
notify-keyspace-events Ex
